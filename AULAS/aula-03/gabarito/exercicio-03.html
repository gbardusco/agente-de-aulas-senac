<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel IoT — Exercício Desafio</title>
    <link rel="stylesheet" href="exercicio-03.css">
</head>
<body>

    <header>
        <h1>🏠 Painel IoT — Monitoramento Residencial</h1>
    </header>

    <main>
        <div class="card card-temp">
            <h3>🌡️ Temperatura</h3>
            <p class="valor">25°C</p>
            <p class="status status-normal">Normal</p>
        </div>

        <div class="card card-umidade">
            <h3>💧 Umidade</h3>
            <p class="valor">60%</p>
            <p class="status status-normal">Normal</p>
        </div>

        <div class="card card-luz">
            <h3>💡 Luminosidade</h3>
            <p class="valor">800 lux</p>
            <p class="status status-normal">Normal</p>
        </div>

        <div class="card card-ruido">
            <h3>🔊 Ruído</h3>
            <p class="valor">45 dB</p>
            <p class="status status-normal">Normal</p>
        </div>
    </main>

    <footer>
        <p>Painel IoT · Aula 03 · UC14 · Senac SP</p>
    </footer>

</body>
</html>
