<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração — Aula 03: CSS</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>Painel de Sensores IoT</h1>
        <p>Monitoramento em tempo real (simulado)</p>
    </header>

    <main>
        <section>
            <h2>Leituras Atuais</h2>

            <div class="card card-normal">
                <h3>🌡️ Temperatura</h3>
                <p class="valor">25°C</p>
                <p class="status">Normal</p>
            </div>

            <div class="card card-alerta">
                <h3>💧 Umidade</h3>
                <p class="valor">85%</p>
                <p class="status">Alta</p>
            </div>

            <div class="card card-normal">
                <h3>💡 Luminosidade</h3>
                <p class="valor">650 lux</p>
                <p class="status">Normal</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Painel IoT — Aula 03 · UC14 · Senac SP</p>
    </footer>

</body>
</html>
