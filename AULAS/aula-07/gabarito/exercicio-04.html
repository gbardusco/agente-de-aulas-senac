<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>Gabarito — Classificador de Temperatura</title>
</head>
<body>
    <h1>Classificador de Temperatura IoT</h1>
    <p>Abra o console (F12) para ver os logs.</p>
    <script>
        let tempDigitada = prompt("Digite a temperatura do sensor (°C):");
        let temperatura = Number(tempDigitada);

        if (temperatura < 15) {
            alert("❄️ Frio! Temperatura: " + temperatura + "°C");
            console.log("Classificação: Frio");
        } else if (temperatura >= 15 && temperatura <= 30) {
            alert("✅ Normal! Temperatura: " + temperatura + "°C");
            console.log("Classificação: Normal");
        } else {
            alert("🔥 Alerta! Temperatura: " + temperatura + "°C");
            console.log("Classificação: Alerta");
        }
    </script>
</body>
</html>
