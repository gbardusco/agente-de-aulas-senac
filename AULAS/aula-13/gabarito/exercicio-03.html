<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito — Aula 13</title>
    <style>
        body { font-family: sans-serif; background: #0a0a1e; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1a1a3e; padding: 20px; border-radius: 10px; width: 250px; margin: 10px auto; border: 2px solid transparent; transition: all 0.3s; }
        .valor { font-size: 32px; font-weight: bold; margin: 10px 0; }
        
        /* Ex 1: Animação */
        @keyframes piscar {
            0%, 100% { opacity: 1; border-color: red; box-shadow: 0 0 10px red; }
            50% { opacity: 0.5; border-color: transparent; box-shadow: none; }
        }
        .alerta { animation: piscar 1s infinite; }

        .log { background: #111; padding: 10px; border-radius: 5px; height: 100px; overflow-y: auto; text-align: left; max-width: 400px; margin: 20px auto; font-family: monospace; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Alerta, Automação e Log</h1>
    
    <div class="card" id="card-temp">
        <h3>🌡️ Temperatura</h3>
        <p class="valor" id="v-temp">25°C</p>
    </div>

    <div class="card" id="card-luz">
        <h3>💡 Luminosidade / Iluminação</h3>
        <p class="valor" id="v-luz">800 lux</p>
        <p id="st-lampada">Lâmpada: ⚫ Desligada</p>
    </div>

    <button id="btn-simular">🎲 Simular Leitura Aleatória</button>

    <h3>📋 Log de Eventos</h3>
    <div class="log" id="caixa-log"></div>

    <script>
        let lampadaLigada = false;

        // Ex 3: Log
        function addLog(msg) {
            let p = document.createElement("p");
            let hora = new Date().toLocaleTimeString();
            p.textContent = `[${hora}] ${msg}`;
            document.getElementById("caixa-log").prepend(p);
        }

        document.getElementById("btn-simular").addEventListener("click", function() {
            let temp = Math.floor(Math.random() * 30) + 15; // 15 a 45
            let luz = Math.floor(Math.random() * 1000); // 0 a 1000

            document.getElementById("v-temp").textContent = temp + "°C";
            document.getElementById("v-luz").textContent = luz + " lux";

            let cardTemp = document.getElementById("card-temp");

            // Ex 1: Alerta visual de Temperatura
            if(temp > 35) {
                if(!cardTemp.classList.contains("alerta")) {
                    cardTemp.classList.add("alerta");
                    addLog(`ALERTA: Temperatura alta (${temp}°C)`);
                }
            } else {
                cardTemp.classList.remove("alerta");
            }

            // Ex 2: Automação (Luz < 200 liga a lâmpada)
            let stLampada = document.getElementById("st-lampada");
            if(luz < 200 && !lampadaLigada) {
                lampadaLigada = true;
                stLampada.textContent = "Lâmpada: 🟡 LIGADA";
                stLampada.style.color = "yellow";
                addLog("Automação: Lâmpada LIGADA devido a baixa luminosidade.");
            } else if (luz >= 200 && lampadaLigada) {
                lampadaLigada = false;
                stLampada.textContent = "Lâmpada: ⚫ Desligada";
                stLampada.style.color = "white";
                addLog("Automação: Lâmpada DESLIGADA.");
            }
        });
    </script>
</body>
</html>
