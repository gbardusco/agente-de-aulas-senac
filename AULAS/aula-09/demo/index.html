<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo — Aula 09: Lâmpada IoT</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a1e; color: #f0f0f0; padding: 40px; text-align: center; }
        h1 { color: #00d4ff; margin-bottom: 30px; }
        .lampada { width: 200px; height: 200px; border-radius: 50%; background: #333; margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; transition: all 0.3s; border: 3px solid #555; }
        .botoes { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        button { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-ligar { background: #34d399; color: #000; }
        .btn-ligar:hover { background: #10b981; }
        .btn-desligar { background: #ef4444; color: #fff; }
        .btn-desligar:hover { background: #dc2626; }
        .btn-piscar { background: #fbbf24; color: #000; }
        .btn-piscar:hover { background: #f59e0b; }
    </style>
</head>
<body>
    <h1>💡 Controle de Lâmpada IoT</h1>
    <div class="lampada" id="lampada">⚫ DESLIGADA</div>
    <div class="botoes">
        <button class="btn-ligar" id="btn-ligar">Ligar</button>
        <button class="btn-desligar" id="btn-desligar">Desligar</button>
        <button class="btn-piscar" id="btn-piscar">Piscar</button>
    </div>

    <script>
        let lampada = document.getElementById("lampada");
        let btnLigar = document.getElementById("btn-ligar");
        let btnDesligar = document.getElementById("btn-desligar");
        let btnPiscar = document.getElementById("btn-piscar");

        btnLigar.addEventListener("click", function() {
            lampada.style.backgroundColor = "#fbbf24";
            lampada.style.borderColor = "#f59e0b";
            lampada.textContent = "💡 LIGADA";
        });

        btnDesligar.addEventListener("click", function() {
            lampada.style.backgroundColor = "#333";
            lampada.style.borderColor = "#555";
            lampada.textContent = "⚫ DESLIGADA";
        });

        btnPiscar.addEventListener("click", function() {
            lampada.style.backgroundColor = "#fde68a";
            lampada.style.borderColor = "#fbbf24";
            lampada.textContent = "⚡ PISCANDO";
            setTimeout(function() {
                lampada.style.backgroundColor = "#333";
                lampada.textContent = "⚫";
                setTimeout(function() {
                    lampada.style.backgroundColor = "#fde68a";
                    lampada.textContent = "⚡ PISCANDO";
                }, 300);
            }, 300);
        });
    </script>
</body>
</html>
