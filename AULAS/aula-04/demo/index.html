<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração — Aula 04: Flexbox</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>🏠 Painel IoT — Flexbox</h1>
        <p>Layout horizontal com CSS Flexbox</p>
    </header>

    <main>
        <section class="cards-container">
            <div class="card">
                <h3>🌡️ Temperatura</h3>
                <p class="valor">25°C</p>
                <p class="status normal">Normal</p>
            </div>
            <div class="card">
                <h3>💧 Umidade</h3>
                <p class="valor">60%</p>
                <p class="status normal">Normal</p>
            </div>
            <div class="card">
                <h3>💡 Luminosidade</h3>
                <p class="valor">800 lux</p>
                <p class="status alerta">Alta</p>
            </div>
            <div class="card">
                <h3>🔊 Ruído</h3>
                <p class="valor">45 dB</p>
                <p class="status normal">Normal</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Painel IoT · Aula 04 · UC14 · Senac SP</p>
    </footer>

</body>
</html>
