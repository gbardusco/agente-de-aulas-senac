<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist do Projeto</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f5; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        h1 { color: #2563eb; text-align: center; }
        .card { background: #fff; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .category { font-size: 20px; font-weight: bold; color: #1e40af; border-bottom: 2px solid #bfdbfe; padding-bottom: 5px; margin-bottom: 15px; margin-top: 25px; }
        .check-item { display: flex; align-items: flex-start; margin-bottom: 12px; }
        .check-item input { margin-top: 5px; margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        .desc { font-size: 15px; }
        .req { color: #dc2626; font-weight: bold; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>
    <h1>✅ Checklist Final — Dashboard IoT</h1>
    <p style="text-align: center;">Use esta lista para garantir que seu projeto atende a todos os requisitos antes da apresentação.</p>

    <div class="card">
        <div class="category">HTML (Estrutura)</div>
        <label class="check-item"><input type="checkbox"><span class="desc">A página usa tags semânticas (<code>&lt;header&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;section&gt;</code>, etc.) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">As seções estão bem divididas (Sensores, Controles, Log) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Uso adequado de IDs para manipulação via JavaScript</span></label>

        <div class="category">CSS (Estilo e Layout)</div>
        <label class="check-item"><input type="checkbox"><span class="desc">O arquivo CSS é externo (vinculado com <code>&lt;link&gt;</code>) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Uso de Flexbox para organizar os cards lado a lado <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Layout Responsivo (uso de <code>@media</code>) adaptável para tela de celular <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Projeto possui um <code>manifest.json</code> linkado (preparado para PWA) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Definição de cores usando variáveis (<code>:root</code>)</span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Pelo menos uma animação CSS (ex: piscar em alerta) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Botões e elementos interativos possuem estilo de <code>:hover</code></span></label>

        <div class="category">JavaScript (Comportamento)</div>
        <label class="check-item"><input type="checkbox"><span class="desc">Uso de <code>setInterval</code> para atualizar os dados automaticamente <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Uso de Condicionais (<code>if/else</code>) para alterar cores baseadas nos valores gerados <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Os botões de controle alteram visualmente o estado (Ligado/Desligado) ao serem clicados <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Existe pelo menos uma regra de automação (ex: ligar algo sozinho) <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">O painel de Logs adiciona novos parágrafos dinamicamente no topo da lista <span class="req">Obrigatório</span></span></label>
        <label class="check-item"><input type="checkbox"><span class="desc">Pelo menos um dado (ex: Temperatura) vem de uma API real através de <code>fetch()</code> <span class="req">Obrigatório</span></span></label>
    </div>
</body>
</html>
