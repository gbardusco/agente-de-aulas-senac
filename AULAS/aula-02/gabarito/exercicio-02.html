<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito — Ex 2: Tabela Comparativa de Sensores</title>
</head>
<body>

    <h1>Tabela Comparativa de Sensores IoT</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nome do Sensor</th>
                <th>Tipo</th>
                <th>Alimentação</th>
                <th>Preço Médio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>DHT11</td>
                <td>Temperatura e Umidade</td>
                <td>3.3V a 5V</td>
                <td>R$ 12,00</td>
            </tr>
            <tr>
                <td>LDR</td>
                <td>Luminosidade</td>
                <td>3.3V a 5V</td>
                <td>R$ 3,00</td>
            </tr>
            <tr>
                <td>HC-SR04</td>
                <td>Distância (Ultrassônico)</td>
                <td>5V</td>
                <td>R$ 10,00</td>
            </tr>
            <tr>
                <td>BMP280</td>
                <td>Pressão Atmosférica</td>
                <td>3.3V</td>
                <td>R$ 18,00</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
