<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito — Aula 10</title>
    <style>
        body { font-family: sans-serif; background: #0a0a1e; color: #fff; padding: 20px; text-align: center; }
        .sensores { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .sensor { background: #1a1a3e; padding: 20px; border-radius: 10px; min-width: 120px; }
        .valor { font-size: 32px; font-weight: bold; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Painel de Sensores (Loop + Função)</h1>
    <div class="sensores" id="container">
        <!-- Divs criadas no HTML para o exercício 2 -->
        <div class="sensor"><div class="valor"></div></div>
        <div class="sensor"><div class="valor"></div></div>
        <div class="sensor"><div class="valor"></div></div>
        <div class="sensor"><div class="valor"></div></div>
        <div class="sensor"><div class="valor"></div></div>
    </div>
    <button id="btn-atualizar">🔄 Atualizar Leituras</button>

    <script>
        // Exercício 1: Função gerarLeitura
        function gerarLeitura(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Exercício 2 e 3: Atualizar 5 sensores com Loop e aplicar cores
        function atualizarTudo() {
            let sensores = document.querySelectorAll(".sensor");

            for(let i = 0; i < sensores.length; i++) {
                let valor = gerarLeitura(10, 50); // Gerando temp aleatória
                let divValor = sensores[i].querySelector(".valor");
                
                divValor.textContent = valor + "°C";

                if(valor > 35) {
                    divValor.style.color = "red";
                } else if(valor > 25) {
                    divValor.style.color = "yellow";
                } else {
                    divValor.style.color = "green";
                }
            }
        }

        // Chamada inicial
        atualizarTudo();

        // Botão de atualizar (Ex 3)
        document.getElementById("btn-atualizar").addEventListener("click", atualizarTudo);
    </script>
</body>
</html>
