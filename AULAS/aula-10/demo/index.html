<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo — Aula 10: Sensores com Loop</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a1e; color: #f0f0f0; padding: 30px; text-align: center; }
        h1 { color: #00d4ff; margin-bottom: 20px; }
        .container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; max-width: 800px; margin: 0 auto; }
        .sensor { background: #16213e; border: 2px solid #333; border-radius: 12px; padding: 20px; min-width: 140px; flex: 1; }
        .sensor h3 { font-size: 14px; color: #a0a0c0; margin-bottom: 8px; }
        .sensor .valor { font-size: 32px; font-weight: bold; }
        .sensor .status { font-size: 12px; margin-top: 8px; padding: 3px 10px; border-radius: 10px; display: inline-block; }
        button { margin-top: 25px; padding: 12px 30px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #00b8e6; }
    </style>
</head>
<body>
    <h1>📊 Painel de Sensores — Loop + Random</h1>
    <div class="container">
        <div class="sensor"><h3>🌡️ Sensor 1</h3><p class="valor" id="s1">--</p><p class="status" id="st1">--</p></div>
        <div class="sensor"><h3>🌡️ Sensor 2</h3><p class="valor" id="s2">--</p><p class="status" id="st2">--</p></div>
        <div class="sensor"><h3>🌡️ Sensor 3</h3><p class="valor" id="s3">--</p><p class="status" id="st3">--</p></div>
        <div class="sensor"><h3>🌡️ Sensor 4</h3><p class="valor" id="s4">--</p><p class="status" id="st4">--</p></div>
        <div class="sensor"><h3>🌡️ Sensor 5</h3><p class="valor" id="s5">--</p><p class="status" id="st5">--</p></div>
    </div>
    <button id="btn-atualizar">🔄 Atualizar Leituras</button>

    <script>
        function gerarLeitura(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function atualizarSensores() {
            for (let i = 1; i <= 5; i++) {
                let valor = gerarLeitura(10, 45);
                let elValor = document.getElementById("s" + i);
                let elStatus = document.getElementById("st" + i);

                elValor.textContent = valor + "°C";

                if (valor > 35) {
                    elValor.style.color = "#ef4444";
                    elStatus.textContent = "🔴 Crítico";
                    elStatus.style.backgroundColor = "#7f1d1d";
                    elStatus.style.color = "#fca5a5";
                } else if (valor > 28) {
                    elValor.style.color = "#fbbf24";
                    elStatus.textContent = "🟡 Atenção";
                    elStatus.style.backgroundColor = "#78350f";
                    elStatus.style.color = "#fbbf24";
                } else {
                    elValor.style.color = "#34d399";
                    elStatus.textContent = "🟢 Normal";
                    elStatus.style.backgroundColor = "#064e3b";
                    elStatus.style.color = "#34d399";
                }
            }
        }

        atualizarSensores();
        document.getElementById("btn-atualizar").addEventListener("click", atualizarSensores);
    </script>
</body>
</html>
